<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Sketchbook Mini</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#ffffff"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#26323a;background:#edf0f1}*{box-sizing:border-box}body{margin:0}header{height:58px;background:white;border-bottom:1px solid #dce1e4;display:flex;align-items:center;gap:12px;padding:0 16px}header strong{font-size:17px}header small{color:#7d878e}button{font:inherit;cursor:pointer}header button,.toolbar button,.palette button{border:1px solid #d9e0e3;background:white;border-radius:9px;padding:9px 12px;color:#35424a}button.active{background:#dceaf8;border-color:#80b0dc;color:#195b91}.toolbar{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:10px 12px;background:#fafbfb;border-bottom:1px solid #dce1e4}.toolbar button{white-space:nowrap;font-size:14px}.toolbar .separator{height:26px;border-left:1px solid #d7dde0;margin:0 3px}.stage{height:calc(100dvh - 111px);overflow:auto;display:flex;justify-content:center;padding:18px 10px 70px;touch-action:pan-y}.paper{width:min(100%,800px);height:1050px;flex-shrink:0;position:relative;background:#fff;box-shadow:0 3px 18px #24323a18;overflow:hidden;touch-action:pan-y}canvas{width:100%;height:100%;display:block;touch-action:pan-y}.palette{position:fixed;z-index:10;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #d5dcdf;box-shadow:0 10px 35px #152b3b30;border-radius:16px;padding:14px;width:min(95vw,550px);display:none}.palette.open{display:block}.palette h3{font-size:14px;margin:0 0 12px}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.palette button{min-height:55px;font-size:13px}.hint{margin-left:auto;font-size:12px;color:#7b858c;white-space:nowrap}.status{font-size:12px;color:#78858d;margin-left:auto}@media(max-width:600px){header{height:50px;padding:0 9px}header strong{font-size:15px}.toolbar{padding:7px}.stage{height:calc(100dvh - 102px);padding:8px 5px 40px}.hint{display:none}.items{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><strong>Sketchbook Mini</strong><small>Prototype 01</small><span class="status" id="status">Saved locally</span><button id="clear">Clear page</button></header><div class="toolbar"><button data-tool="pen" class="active">✎ Pen</button><button data-tool="eraser">◌ Eraser</button><button data-tool="select">⬚ Select</button><span class="separator"></span><button id="components">▦ Components</button><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="export">↓ PNG</button><span class="hint">Stylus draws · finger scrolls</span></div><main class="stage"><div class="paper" id="paper"><canvas id="canvas"></canvas></div></main><aside class="palette" id="palette"><h3>Insert a sketch component <span style="float:right;cursor:pointer" id="close">✕</span></h3><div class="items" id="items"></div></aside><script>
(()=>{'use strict';const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),paper=document.getElementById('paper'),palette=document.getElementById('palette'),status=document.getElementById('status');let tool='pen',items=[],history=[],future=[],current=null,selected=-1,drag=null,scale=1;const W=800,H=1050,KEY='sketchbook-mini-v1';const components=['Rectangle','Circle','Line','Arrow','Button','Input','Dropdown','Checkbox','Radio','Toggle','Tabs','Table','Text','Icon','Card'];function save(){try{localStorage.setItem(KEY,JSON.stringify(items));status.textContent='Saved locally'}catch(e){status.textContent='Storage unavailable'}}try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}function checkpoint(){history.push(JSON.stringify(items));if(history.length>80)history.shift();future=[]}function rnd(seed){let x=Math.sin(seed*78.233+12.31)*43758.5453;return x-Math.floor(x)}function roughLine(x1,y1,x2,y2,seed){const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),steps=Math.max(2,Math.ceil(len/25));ctx.beginPath();for(let i=0;i<=steps;i++){let t=i/steps,offset=(i===0||i===steps)?0:(rnd(seed+i*7)-.5)*3.2;let x=x1+dx*t+(-dy/Math.max(1,len))*offset,y=y1+dy*t+(dx/Math.max(1,len))*offset;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()}function roughRect(x,y,w,h,seed){roughLine(x,y,x+w,y,seed);roughLine(x+w,y,x+w,y+h,seed+11);roughLine(x+w,y+h,x,y+h,seed+22);roughLine(x,y+h,x,y,seed+33)}function roughEllipse(x,y,w,h,seed){ctx.beginPath();for(let i=0;i<=52;i++){const a=i/52*Math.PI*2,variation=1+(rnd(seed+Math.floor(i/4))-.5)*.045,px=x+w/2+Math.cos(a)*w/2*variation,py=y+h/2+Math.sin(a)*h/2*variation;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke()}function label(text,x,y,size=19){ctx.font=`${size}px "Comic Sans MS", "Segoe Print", cursive`;ctx.fillStyle='#333';ctx.fillText(text,x,y)}function drawComponent(o){let {x,y,w,h,type,seed}=o;ctx.save();ctx.lineWidth=2;ctx.strokeStyle='#3b4144';ctx.lineCap='round';ctx.lineJoin='round';if(type==='Rectangle'||type==='Card'||type==='Button'||type==='Input'||type==='Dropdown'||type==='Tabs'||type==='Table'){if(type==='Button'){ctx.fillStyle='#eeeeed';ctx.fillRect(x+2,y+2,w-4,h-4)}roughRect(x,y,w,h,seed)}if(type==='Circle'||type==='Radio')roughEllipse(x,y,w,h,seed);if(type==='Line'||type==='Arrow'){roughLine(x,y,x+w,y+h,seed);if(type==='Arrow'){roughLine(x+w,y+h,x+w-15,y+h-8,seed+4);roughLine(x+w,y+h,x+w-12,y+h+10,seed+5)}}if(type==='Checkbox')roughRect(x,y,25,25,seed);if(type==='Toggle'){roughEllipse(x,y,w,h,seed);roughEllipse(x+4,y+4,h-8,h-8,seed+8)}if(type==='Icon'){roughEllipse(x,y,35,35,seed);roughLine(x+9,y+18,x+15,y+26,seed+2);roughLine(x+15,y+26,x+28,y+8,seed+3)}if(type==='Button')label(o.text||'Button',x+13,y+h/2+7);if(type==='Input')label(o.text||'Enter text...',x+10,y+h/2+7);if(type==='Dropdown'){label(o.text||'Select...',x+10,y+h/2+7);roughLine(x+w-24,y+14,x+w-16,y+23,seed+1);roughLine(x+w-16,y+23,x+w-8,y+14,seed+2)}if(type==='Checkbox')label(o.text||'Option',x+35,y+21);if(type==='Radio')label(o.text||'Option',x+w+10,y+h/2+6);if(type==='Tabs'){roughLine(x,y+35,x+w,y+35,seed+7);label('Tab 1     Tab 2     Tab 3',x+12,y+25,17)}if(type==='Table'){for(let i=1;i<4;i++)roughLine(x,y+i*h/4,x+w,y+i*h/4,seed+i);roughLine(x+w*.4,y,x+w*.4,y+h,seed+5)}if(type==='Text')label(o.text||'Your label',x,y+24,21);if(type==='Card')label(o.text||'Card title',x+12,y+28);ctx.restore()}function drawStroke(o){ctx.save();ctx.strokeStyle=o.color||'#283038';ctx.lineWidth=o.width||2.7;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();o.points.forEach((p,i)=>{if(!i)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});if(o.points.length===1){const p=o.points[0];ctx.lineTo(p.x+.1,p.y+.1)}ctx.stroke();ctx.restore()}function render(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);items.forEach((o,i)=>{o.kind==='stroke'?drawStroke(o):drawComponent(o);if(i===selected){let b=bounds(o);ctx.save();ctx.setLineDash([6,4]);ctx.strokeStyle='#3983c0';ctx.lineWidth=1.5;ctx.strokeRect(b.x-7,b.y-7,b.w+14,b.h+14);ctx.restore()}});if(current)drawStroke(current)}function bounds(o){if(o.kind!=='stroke')return {x:o.x,y:o.y,w:o.w,h:o.h};let xs=o.points.map(p=>p.x),ys=o.points.map(p=>p.y);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function hit(p){for(let i=items.length-1;i>=0;i--){const b=bounds(items[i]);if(p.x>=b.x-12&&p.x<=b.x+b.w+12&&p.y>=b.y-12&&p.y<=b.y+b.h+12)return i}return -1}function setTool(t){tool=t;selected=-1;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));render()}function insert(type){checkpoint();const dims={Rectangle:[180,105],Circle:[90,90],Line:[135,0],Arrow:[135,0],Button:[120,42],Input:[210,42],Dropdown:[200,42],Checkbox:[120,25],Radio:[24,24],Toggle:[65,32],Tabs:[290,110],Table:[260,150],Text:[170,35],Icon:[45,45],Card:[240,140]};let [w,h]=dims[type],n=items.filter(i=>i.kind==='component').length;items.push({kind:'component',type,x:65+(n%4)*28,y:100+(n%6)*44,w,h,seed:Math.random()*1000});selected=items.length-1;palette.classList.remove('open');setTool('select');selected=items.length-1;render();save()}document.getElementById('items').innerHTML=components.map(c=>`<button data-insert="${c}">${c}</button>`).join('');document.getElementById('items').onclick=e=>{let b=e.target.closest('[data-insert]');if(b)insert(b.dataset.insert)};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));document.getElementById('components').onclick=()=>palette.classList.toggle('open');document.getElementById('close').onclick=()=>palette.classList.remove('open');canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;if(e.button!==0)return;const p=pos(e);if(tool==='pen'){checkpoint();current={kind:'stroke',points:[p],width:e.pointerType==='pen'?2.5:2.8,color:'#283038'};canvas.setPointerCapture(e.pointerId);canvas.style.touchAction='none'}else if(tool==='eraser'){let i=hit(p);if(i>=0){checkpoint();items.splice(i,1);save();render()}canvas.setPointerCapture(e.pointerId)}else if(tool==='select'){selected=hit(p);if(selected>=0){checkpoint();drag={p,original:JSON.parse(JSON.stringify(items[selected]))};canvas.setPointerCapture(e.pointerId)}render()}});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const p=pos(e);if(current){current.points.push(p);render()}else if(drag&&selected>=0){let o=items[selected],dx=p.x-drag.p.x,dy=p.y-drag.p.y;if(o.kind==='stroke')o.points=drag.original.points.map(q=>({...q,x:q.x+dx,y:q.y+dy}));else{o.x=drag.original.x+dx;o.y=drag.original.y+dy}render()}});function end(){if(current){items.push(current);current=null;save()}if(drag){drag=null;save()}canvas.style.touchAction='pan-y';render()}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('dblclick',e=>{if(tool!=='select')return;let i=hit(pos(e));if(i<0||items[i].kind!=='component')return;let o=items[i],value=prompt('Component label',o.text||'');if(value!==null){checkpoint();o.text=value;save();render()}});document.getElementById('undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(items));items=JSON.parse(history.pop());selected=-1;save();render()};document.getElementById('redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(items));items=JSON.parse(future.pop());selected=-1;save();render()};document.getElementById('clear').onclick=()=>{if(!confirm('Clear this page?'))return;checkpoint();items=[];selected=-1;save();render()};document.getElementById('export').onclick=()=>{render();let a=document.createElement('a');a.download='sketchbook-page.png';a.href=canvas.toDataURL('image/png');a.click()};document.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&selected>=0){checkpoint();items.splice(selected,1);selected=-1;save();render()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();document.getElementById(e.shiftKey?'redo':'undo').click()}});render()})();
</script><script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn)); }</script></body></html>
